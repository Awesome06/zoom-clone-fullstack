name: Fullstack CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-lint:
    name: Backend Checks (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Lint and Format with Ruff
        run: |
          cd backend
          ruff check .
          ruff format --check .
          
      # Uncomment when unit tests are added
      # - name: Test with pytest
      #   run: |
      #     cd backend
      #     pytest

  frontend-lint:
    name: Frontend Checks (ESLint & TSC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint
          
      - name: Typecheck with TSC
        run: |
          cd frontend
          npx tsc --noEmit
