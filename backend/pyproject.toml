[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Select commonly used rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RET", # flake8-return
]

ignore = [
    "B008", # Do not perform function call in argument defaults (Needed for FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__.py files as they are used to re-export modules
"__init__.py" = ["F401"]
# Ignore unused import for FastAPI app in entrypoint since uvicorn uses it as a string reference
"main.py" = ["F401"]
